<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pase QR · JOSEFA VERGARA · 1°A · V4</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--good:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#172554,#2563eb);color:white;padding:24px 5%;position:sticky;top:0;z-index:10}
h1{margin:0;font-size:25px}header p{margin:6px 0 0;opacity:.85}.wrap{max-width:1250px;margin:auto;padding:22px 5%}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.tab{border:1px solid var(--line);background:white;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}.tab.active{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.two{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 18px #1e3a8a0d;margin-bottom:16px}
.kpi{font-size:28px;font-weight:800}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:white;font-weight:700;cursor:pointer}.btn.alt{background:#eef2ff;color:#3730a3}.btn.danger{background:#fee2e2;color:#991b1b}.btn.gray{background:#e5e7eb;color:#111827}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d1d5db;border-radius:9px;background:white;font:inherit}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:#4b5563}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800}.present{background:#dcfce7;color:#166534}.late{background:#fef3c7;color:#92400e}.absent{background:#fee2e2;color:#991b1b}.neutral{background:#eef2f7;color:#475569}
.bar{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:#2563eb}.profile{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.avatar{width:54px;height:54px;border-radius:15px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:900;font-size:20px}
.big{font-size:42px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#eff6ff;color:#1e40af}.dangerbox{padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50}.modal>div{background:white;border-radius:18px;padding:22px;width:min(650px,92vw);max-height:90vh;overflow:auto}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.row3{grid-template-columns:1fr}}
@media(max-width:600px){.grid,.row{grid-template-columns:1fr}header{padding:18px}.wrap{padding:16px}.card{padding:14px}table{font-size:12px}}
</style></head><body>
<header><h1>JOSEFA VERGARA · 1°A</h1><p>Pase QR · Control escolar · Versión 4</p></header>
<div class="wrap">
<nav id="nav"></nav>
<section id="app"></section>
</div>
<div id="modal" class="hidden"></div>
<script>
const STUDENTS=[{"qr": "JVG-1A-01", "name": "AGUILAR AGUILAR JUAN ARMANDO", "id": "1259885"}, {"qr": "JVG-1A-02", "name": "AGUILAR ESCOBEDO ESTRELLA GUADALUPE", "id": "1252409"}, {"qr": "JVG-1A-03", "name": "AGUILAR TABAREZ OMAR", "id": "1198042"}, {"qr": "JVG-1A-04", "name": "AMADOR PEREZ DIEGO ARMANDO", "id": "1266386"}, {"qr": "JVG-1A-05", "name": "BARCENAS PACHECO LIZBETH ARIANA", "id": "1254861"}, {"qr": "JVG-1A-06", "name": "BARCENAS RIVERA REYMUNDO FRANCISCO", "id": "1251585"}, {"qr": "JVG-1A-07", "name": "BAZAN RANGEL CARLA ABIGAIL", "id": "1229760"}, {"qr": "JVG-1A-08", "name": "DORANTES TERRAZAS JOSE GUADALUPE", "id": "1239832"}, {"qr": "JVG-1A-09", "name": "ESCAMILLA LOPEZ ARIADNA GUADALUPE", "id": "1191873"}, {"qr": "JVG-1A-10", "name": "GALICIA MARTINEZ SCHOENSTATT", "id": "1262938"}, {"qr": "JVG-1A-11", "name": "GARCIA TERRAZAS PABLO ANTONIO", "id": "1264218"}, {"qr": "JVG-1A-12", "name": "HERNANDEZ MARTINEZ AMERICA LIZETH", "id": "1228161"}, {"qr": "JVG-1A-13", "name": "HERNANDEZ MORENO VALENTINA", "id": "1244916"}, {"qr": "JVG-1A-14", "name": "HERNANDEZ TAVAREZ CAMILA", "id": "1188385"}, {"qr": "JVG-1A-15", "name": "HURTADO HIDALGO JUAN LUIS", "id": "1237999"}, {"qr": "JVG-1A-16", "name": "IBARRA GUZMAN ALEXA LIZETH", "id": "1268202"}, {"qr": "JVG-1A-17", "name": "JIMENEZ BONILLA JUAN CARLOS", "id": "1238643"}, {"qr": "JVG-1A-18", "name": "LIRA AGUILAR JUAN PABLO", "id": "1256647"}, {"qr": "JVG-1A-19", "name": "LOPEZ TAVARES LEONEL", "id": "1253627"}, {"qr": "JVG-1A-20", "name": "MALDONADO TABARES CINTHIA GUADALUPE", "id": "1198026"}, {"qr": "JVG-1A-21", "name": "NUÑEZ ALVAREZ SAMARA KAELYN", "id": "1251141"}, {"qr": "JVG-1A-22", "name": "NUÑEZ LOPEZ MIA YAMILETH", "id": "1192369"}, {"qr": "JVG-1A-23", "name": "OLVERA MARTINEZ ABRAHAM MATEO", "id": "1252531"}, {"qr": "JVG-1A-24", "name": "PEREZ LOPEZ JOSE ARCHIVALDO", "id": "1101407"}, {"qr": "JVG-1A-25", "name": "PIÑA PORRAS JOSHUA SAID", "id": "1209306"}, {"qr": "JVG-1A-26", "name": "PORRAS PORRAS JUAN DIEGO", "id": "1248499"}, {"qr": "JVG-1A-27", "name": "RESENDIZ PORRAS ANDREA", "id": "1206033"}, {"qr": "JVG-1A-28", "name": "ROSAS LIRA DANTE JESUS", "id": "1221992"}, {"qr": "JVG-1A-29", "name": "SAMAYOA VEGA MOISES EMILIANO", "id": "1238616"}, {"qr": "JVG-1A-30", "name": "SANCHEZ AGUILAR DARIANA", "id": "1237528"}, {"qr": "JVG-1A-31", "name": "SANCHEZ LUNA NATALIA VALENTINA", "id": "1240274"}, {"qr": "JVG-1A-32", "name": "SERRANO MORALES ELIANA BELEN", "id": "1252883"}, {"qr": "JVG-1A-33", "name": "TABARES TERRAZAS NATALY", "id": "1194447"}, {"qr": "JVG-1A-34", "name": "TERRAZAS HERNANDEZ ROMINA", "id": "1260210"}, {"qr": "JVG-1A-35", "name": "TERRAZAS PACHECO DAVID ALEJANDRO", "id": "1252484"}, {"qr": "JVG-1A-36", "name": "VAZQUEZ FLORES ALEXIA DAYANA", "id": "1307611"}, {"qr": "JVG-1A-37", "name": "VEGA OLVERA SCHOENSTATT NICOLE", "id": "1254563"}, {"qr": "JVG-1A-38", "name": "VEGA RODRIGUEZ DORIAN JESUS", "id": "1252919"}, {"qr": "JVG-1A-39", "name": "VILLAGRAN TAVARES JHOSABET", "id": "1234890"}];
const KEY='paseqr_jvg_1a_v4';
const today=()=>new Date().toISOString().slice(0,10);
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{pin:'1234',subject:'',period:'',sessions:[],attendance:[],activities:[],submissions:[],grades:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function student(q){return STUDENTS.find(s=>s.qr.toLowerCase()===String(q).trim().toLowerCase()||s.id===String(q).trim());}
function pct(n,d){return d?Math.round(n/d*100):0}
function sessionsFor(sid,period=''){return db.sessions.filter(s=>!period||s.period===period)}
function attFor(sid,period=''){const ss=sessionsFor(sid,period), a=db.attendance.filter(x=>x.sid===sid&&(!period||x.period===period));return {n:ss.length,p:a.filter(x=>x.status==='present').length,l:a.filter(x=>x.status==='late').length,f:a.filter(x=>x.status==='absent').length};}
function avgFor(sid,period=''){const g=db.grades.filter(x=>x.sid===sid&&(!period||x.period===period)).map(x=>Number(x.value)).filter(x=>!isNaN(x));return g.length?Math.round(g.reduce((a,b)=>a+b,0)/g.length*10)/10:null}
function workPct(sid,period=''){const aa=db.activities.filter(x=>!period||x.period===period);if(!aa.length)return 0;const done=aa.filter(a=>db.submissions.some(s=>s.aid===a.id&&s.sid===sid&&s.done)).length;return pct(done,aa.length)}
let tab='inicio', selected=null;
const navItems=[['inicio','Inicio'],['pase','Pase QR'],['alumnos','Alumnos'],['actividades','Tareas y trabajos'],['calificaciones','Calificaciones'],['reportes','Reportes'],['config','Configuración']];
function nav(){document.getElementById('nav').innerHTML=navItems.map(x=>`<button class="tab ${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('');}
function render(){nav();const a=document.getElementById('app');({inicio:home,pase:pass,alumnos:roster,actividades:activities,calificaciones:grades,reportes:reports,config:config}[tab])(a);}
function home(a){
 const att=db.attendance.filter(x=>x.date===today()), pres=att.filter(x=>x.status==='present').length, late=att.filter(x=>x.status==='late').length;
 const avgs=STUDENTS.map(s=>avgFor(s.qr)).filter(x=>x!=null); const avg=avgs.length?(Math.round(avgs.reduce((a,b)=>a+b,0)/avgs.length*10)/10):'—';
 a.innerHTML=`<div class="grid">
 <div class="card"><div class="muted">Estudiantes</div><div class="kpi">${STUDENTS.length}</div></div>
 <div class="card"><div class="muted">Sesiones</div><div class="kpi">${db.sessions.length}</div></div>
 <div class="card"><div class="muted">Asistencias hoy</div><div class="kpi">${pres+late}</div></div>
 <div class="card"><div class="muted">Promedio registrado</div><div class="kpi">${avg}</div></div></div>
 <div class="two"><div class="card"><h2>Resumen del grupo</h2><p class="muted">Consulta rápida de asistencia, actividades y calificaciones.</p>
 <div class="actions"><button class="btn" onclick="tab='pase';render()">Abrir pase QR</button><button class="btn alt" onclick="tab='alumnos';render()">Ver alumnos</button></div>
 <hr><h3>Actividad de hoy</h3><p>Presentes: <b>${pres}</b> · Retardos: <b>${late}</b> · Faltas registradas: <b>${att.filter(x=>x.status==='absent').length}</b></p></div>
 <div class="card"><h2>Seguimiento</h2><p class="muted">Puedes abrir la ficha individual de cualquier estudiante.</p><div class="notice">V4 agrega perfil individual, promedio, asistencia, entregas y reportes.</div></div></div>`;
}
function pass(a){
 const sid=document.getElementById('scanInput')?.value||''; const active=db.sessions.find(s=>s.open);
 a.innerHTML=`<div class="two"><div class="card"><h2>Pase QR</h2>
 <div class="row"><div><label>Sesión</label><select id="sessionSel">${db.sessions.map((s,i)=>`<option value="${i}" ${active===s?'selected':''}>${esc(s.date)} · ${esc(s.subject||'Sin materia')} · ${esc(s.period||'Sin periodo')} ${s.open?'· ABIERTA':''}</option>`).join('')}</select></div>
 <div><label>QR / matrícula</label><input id="scanInput" autofocus placeholder="JVG-1A-01|1259885" onkeydown="if(event.key==='Enter')registerAtt()"></div></div>
 <div class="actions" style="margin-top:12px"><button class="btn" onclick="registerAtt()">Registrar asistencia</button><button class="btn gray" onclick="openNewSession()">Nueva sesión</button></div>
 <p class="muted">La cámara puede usarse mediante el lector QR externo de tu navegador; también puedes escribir o pegar el contenido del QR.</p></div>
 <div class="card"><h2>Sesión actual</h2>${active?`<p><b>${esc(active.subject||'Sin materia')}</b><br>${active.date} · ${active.start||''} · ${esc(active.period||'')}</p><div class="notice">Sesión abierta. Cada estudiante se registra una sola vez.</div>`:`<div class="dangerbox">No hay una sesión abierta.</div>`}</div></div>
 <div class="card"><h2>Registros de la sesión</h2><div id="attTable"></div></div>`;
 drawAtt();
}
function drawAtt(){const el=document.getElementById('attTable');if(!el)return;const idx=Number(document.getElementById('sessionSel')?.value||0), s=db.sessions[idx];if(!s){el.innerHTML='<p class="muted">Crea una sesión para comenzar.</p>';return}
 const rows=db.attendance.filter(x=>x.sessionId===s.id);el.innerHTML=`<table><tr><th>Alumno</th><th>Estado</th><th>Hora</th><th></th></tr>${rows.map(x=>{const st=STUDENTS.find(s=>s.qr===x.sid);return `<tr><td>${esc(st?.name||x.sid)}</td><td><span class="pill ${x.status}">${x.status==='present'?'Presente':x.status==='late'?'Retardo':'Falta'}</span></td><td>${x.time||''}</td><td><button class="btn gray" onclick="removeAtt('${x.id}')">Quitar</button></td></tr>`}).join('')}</table>`}
function registerAtt(){const input=document.getElementById('scanInput'), q=input.value.trim();if(!q)return;const st=student(q.split('|')[0])||student(q.split('|')[1]);if(!st){alert('QR o matrícula no encontrado.');return}
 const idx=Number(document.getElementById('sessionSel')?.value||0), s=db.sessions[idx];if(!s){alert('Primero crea una sesión.');return}
 if(db.attendance.some(x=>x.sessionId===s.id&&x.sid===st.qr)){alert('Este estudiante ya tiene registro en esta sesión.');return}
 const now=new Date(), start=new Date(s.date+'T'+(s.start||'07:00'));const mins=Math.round((now-start)/60000);const status=mins>(Number(s.tolerance)||10)?'late':'present';
 db.attendance.push({id:crypto.randomUUID(),sessionId:s.id,sid:st.qr,date:s.date,period:s.period,status,time:now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})});save();input.value='';drawAtt();alert(st.name+' · '+(status==='late'?'Retardo':'Presente'))}
function removeAtt(id){db.attendance=db.attendance.filter(x=>x.id!==id);save();drawAtt();}
function openNewSession(){
 show(`<h2>Nueva sesión</h2><div class="row"><div><label>Materia</label><input id="fsub" value="${esc(db.subject)}"></div><div><label>Periodo</label><input id="fper" value="${esc(db.period)}" placeholder="Ej. 1er periodo"></div></div><div class="row"><div><label>Fecha</label><input id="fdate" type="date" value="${today()}"></div><div><label>Hora de inicio</label><input id="ftime" type="time" value="07:00"></div></div><div><label>Tolerancia para retardo (minutos)</label><input id="ftol" type="number" value="10"></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="createSession()">Crear y abrir</button><button class="btn gray" onclick="hide()">Cancelar</button></div>`)
}
function createSession(){db.subject=fsub.value;db.period=fper.value;db.sessions.unshift({id:crypto.randomUUID(),subject:fsub.value,period:fper.value,date:fdate.value,start:ftime.value,tolerance:Number(ftol.value)||10,open:true});db.sessions.forEach((s,i)=>{if(i>0)s.open=false});save();hide();tab='pase';render();}
function roster(a){
 a.innerHTML=`<div class="card"><div class="row"><div><label>Buscar alumno</label><input id="search" oninput="drawRoster()" placeholder="Nombre, QR o matrícula"></div><div><label>Periodo</label><select id="rper" onchange="drawRoster()"><option value="">Todos</option>${[...new Set(db.sessions.map(x=>x.period).filter(Boolean))].map(p=>`<option>${esc(p)}</option>`).join('')}</select></div></div></div><div id="roster"></div>`;drawRoster();
}
function drawRoster(){const q=(document.getElementById('search')?.value||'').toLowerCase(), per=document.getElementById('rper')?.value||'', el=document.getElementById('roster');if(!el)return;
 const list=STUDENTS.filter(s=>(!q||(s.name+s.qr+s.id).toLowerCase().includes(q)));el.innerHTML=`<div class="grid">${list.map(s=>{const at=attFor(s.qr,per), av=avgFor(s.qr,per), wp=workPct(s.qr,per);return `<div class="card"><div class="profile"><div style="display:flex;gap:12px"><div class="avatar">${s.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><b>${esc(s.name)}</b><div class="muted">${s.qr} · ${s.id}</div></div></div><button class="btn alt" onclick="profile('${s.qr}')">Ficha</button></div><hr><div class="row3"><div><div class="muted">Asistencia</div><b>${pct(at.p+at.l,at.n)}%</b></div><div><div class="muted">Promedio</div><b>${av??'—'}</b></div><div><div class="muted">Entregas</div><b>${wp}%</b></div></div><div class="bar" style="margin-top:10px"><span style="width:${Math.min(100,wp)}%"></span></div></div>`}).join('')}</div>`;
}
function profile(qr){
 const s=student(qr); selected=qr; const periods=[...new Set(db.sessions.map(x=>x.period).filter(Boolean))];show(`<div class="profile"><div><h2>${esc(s.name)}</h2><div class="muted">${s.qr} · matrícula ${s.id}</div></div><div class="avatar">${s.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div></div>
 <hr><div class="grid"><div><div class="muted">Asistencia</div><div class="big">${pct(attFor(qr).p+attFor(qr).l,attFor(qr).n)}%</div></div><div><div class="muted">Promedio</div><div class="big">${avgFor(qr)??'—'}</div></div><div><div class="muted">Entregas</div><div class="big">${workPct(qr)}%</div></div><div><div class="muted">Sesiones</div><div class="big">${attFor(qr).n}</div></div></div>
 <h3>Desglose de asistencia</h3><p>Presentes: ${attFor(qr).p} · Retardos: ${attFor(qr).l} · Faltas: ${attFor(qr).f}</p>
 <h3>Actividades</h3><table><tr><th>Actividad</th><th>Tipo</th><th>Estado</th><th>Calificación</th></tr>${db.activities.map(a=>{const sub=db.submissions.find(x=>x.aid===a.id&&x.sid===qr);const g=db.grades.find(x=>x.aid===a.id&&x.sid===qr);return `<tr><td>${esc(a.name)}</td><td>${esc(a.type)}</td><td>${sub?.done?'Entregada':'Pendiente'}</td><td>${g?g.value:'—'}</td></tr>`}).join('')}</table><div class="actions" style="margin-top:14px"><button class="btn" onclick="printProfile('${qr}')">Imprimir ficha</button><button class="btn gray" onclick="hide()">Cerrar</button></div>`);
}
function printProfile(qr){const s=student(qr), a=attFor(qr), av=avgFor(qr), wp=workPct(qr);const w=open('','_blank');w.document.write(`<html><head><title>Ficha ${s.name}</title><style>body{font-family:Arial;padding:35px}h1{margin-bottom:4px}.box{display:inline-block;border:1px solid #ddd;padding:16px;margin:5px}.bar{height:10px;background:#ddd}.fill{height:10px;background:#2563eb;width:${wp}%}</style></head><body><h1>JOSEFA VERGARA · 1°A</h1><h2>${esc(s.name)}</h2><p>QR: ${s.qr} · Matrícula: ${s.id}</p><div class="box">Asistencia: <b>${pct(a.p+a.l,a.n)}%</b></div><div class="box">Promedio: <b>${av??'—'}</b></div><div class="box">Entregas: <b>${wp}%</b></div><p>Presentes: ${a.p} · Retardos: ${a.l} · Faltas: ${a.f}</p><button onclick="print()">Imprimir</button></body></html>`);w.document.close();}
function activities(a){
 a.innerHTML=`<div class="two"><div class="card"><h2>Nueva actividad</h2><div class="row"><div><label>Nombre</label><input id="an" placeholder="Ej. Tarea 1"></div><div><label>Tipo</label><select id="at"><option>Tarea</option><option>Trabajo</option><option>Examen</option><option>Proyecto</option><option>Participación</option></select></div></div><div class="row"><div><label>Periodo</label><input id="ap" value="${esc(db.period)}"></div><div><label>Fecha de entrega</label><input id="ad" type="date"></div></div><button class="btn" style="margin-top:10px" onclick="addActivity()">Agregar actividad</button></div><div class="card"><h2>Actividades</h2><div id="alist"></div></div></div>`;drawActivities();
}
function drawActivities(){const e=document.getElementById('alist');if(!e)return;e.innerHTML=db.activities.map(a=>`<div class="card" style="margin:8px 0;padding:12px"><b>${esc(a.name)}</b> · ${esc(a.type)}<div class="muted">${a.period||''} · Entrega: ${a.due||'—'}</div><p>${db.submissions.filter(x=>x.aid===a.id&&x.done).length}/${STUDENTS.length} entregadas</p><button class="btn alt" onclick="markSub('${a.id}')">Registrar entregas</button> <button class="btn danger" onclick="deleteActivity('${a.id}')">Eliminar</button></div>`).join('')||'<p class="muted">Aún no hay actividades.</p>'}
function addActivity(){if(!an.value.trim())return;db.activities.unshift({id:crypto.randomUUID(),name:an.value,type:at.value,period:ap.value,due:ad.value});save();render();}
function deleteActivity(id){if(confirm('¿Eliminar actividad y sus registros?')){db.activities=db.activities.filter(a=>a.id!==id);db.submissions=db.submissions.filter(x=>x.aid!==id);db.grades=db.grades.filter(x=>x.aid!==id);save();render();}}
function markSub(aid){const ac=db.activities.find(x=>x.id===aid);show(`<h2>Entregas · ${esc(ac.name)}</h2><table>${STUDENTS.map(s=>{const x=db.submissions.find(z=>z.aid===aid&&z.sid===s.qr);return `<tr><td>${esc(s.name)}</td><td><input type="checkbox" ${x?.done?'checked':''} onchange="toggleSub('${aid}','${s.qr}',this.checked)"> Entregó</td></tr>`}).join('')}</table><button class="btn gray" onclick="hide()">Cerrar</button>`)}
function toggleSub(aid,sid,done){let x=db.submissions.find(z=>z.aid===aid&&z.sid===sid);if(!x){x={aid,sid,done:false};db.submissions.push(x)}x.done=done;save();}
function grades(a){a.innerHTML=`<div class="card"><h2>Calificaciones</h2><p class="muted">Captura calificaciones de 0 a 10 por actividad. Se guardan en este navegador.</p><div class="row"><div><label>Actividad</label><select id="gact">${db.activities.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>Periodo</label><input id="gper" value="${esc(db.period)}"></div></div><div id="gradeTable" style="margin-top:15px"></div></div>`;drawGrades();}
function drawGrades(){const e=document.getElementById('gradeTable');if(!e)return;const aid=document.getElementById('gact')?.value;if(!aid){e.innerHTML='<p class="muted">Crea una actividad primero.</p>';return}const ac=db.activities.find(x=>x.id===aid);e.innerHTML=`<table><tr><th>Alumno</th><th>Calificación</th></tr>${STUDENTS.map(s=>{const g=db.grades.find(x=>x.aid===aid&&x.sid===s.qr);return `<tr><td>${esc(s.name)}</td><td><input type="number" min="0" max="10" step=".1" value="${g?.value??''}" onchange="setGrade('${aid}','${s.qr}',this.value)"></td></tr>`}).join('')}</table>`}
function setGrade(aid,sid,v){v=v===''?null:Number(v);if(v!=null&&(v<0||v>10))return alert('La calificación debe estar entre 0 y 10.');db.grades=db.grades.filter(x=>!(x.aid===aid&&x.sid===sid));if(v!=null)db.grades.push({aid,sid,value:v,period:document.getElementById('gper')?.value||''});save();}
function reports(a){a.innerHTML=`<div class="card"><h2>Reportes y exportaciones</h2><p class="muted">Descarga tus registros para respaldo o análisis.</p><div class="actions"><button class="btn" onclick="csvAttendance()">CSV asistencia</button><button class="btn" onclick="csvGrades()">CSV calificaciones</button><button class="btn" onclick="csvSubs()">CSV entregas</button><button class="btn alt" onclick="backup()">Respaldo JSON</button><label class="btn gray" style="display:inline-block;cursor:pointer">Restaurar JSON<input type="file" accept=".json" onchange="restore(event)" style="display:none"></label></div></div>
 <div class="card"><h2>Resumen por alumno</h2><table><tr><th>Alumno</th><th>Asistencia</th><th>Promedio</th><th>Entregas</th></tr>${STUDENTS.map(s=>{const x=attFor(s.qr);return `<tr><td>${esc(s.name)}</td><td>${pct(x.p+x.l,x.n)}%</td><td>${avgFor(s.qr)??'—'}</td><td>${workPct(s.qr)}%</td></tr>`}).join('')}</table></div>`}
function csv(rows,name){const blob=new Blob(['\ufeff'+rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}
function csvAttendance(){csv([['Fecha','Periodo','QR','Alumno','Estado','Hora'],...db.attendance.map(x=>{const s=student(x.sid);return[x.date,x.period,x.sid,s?.name,x.status,x.time]})],'asistencia_1A.csv')}
function csvGrades(){csv([['Alumno','QR','Actividad','Tipo','Periodo','Calificación'],...db.grades.map(g=>{const s=student(g.sid),a=db.activities.find(x=>x.id===g.aid);return[s?.name,g.sid,a?.name,a?.type,g.period,g.value]})],'calificaciones_1A.csv')}
function csvSubs(){csv([['Alumno','QR','Actividad','Tipo','Periodo','Entrego'],...db.activities.flatMap(a=>STUDENTS.map(s=>[s.name,s.qr,a.name,a.type,a.period,db.submissions.some(x=>x.aid===a.id&&x.sid===s.qr&&x.done)?'Sí':'No']))],'entregas_1A.csv')}
function backup(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='respaldo_paseqr_1A.json';a.click();}
function restore(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.sessions||!x.attendance)throw 0;db=x;save();render();alert('Respaldo restaurado.')}catch(e){alert('Archivo no válido.')}};r.readAsText(f);}
function config(a){a.innerHTML=`<div class="two"><div class="card"><h2>Configuración</h2><label>Materia por defecto</label><input id="csub" value="${esc(db.subject)}"><label style="margin-top:10px">Periodo por defecto</label><input id="cper" value="${esc(db.period)}"><label style="margin-top:10px">PIN del docente</label><input id="cpin" value="${esc(db.pin)}" type="password"><button class="btn" style="margin-top:12px" onclick="saveConfig()">Guardar</button></div><div class="card"><h2>Información</h2><p><b>Escuela:</b> JOSEFA VERGARA</p><p><b>Grupo:</b> 1°A</p><p><b>Alumnos cargados:</b> ${STUDENTS.length}</p><p><b>Almacenamiento:</b> local del navegador</p><div class="notice">Haz un respaldo JSON periódicamente para no perder tus datos.</div><hr><button class="btn danger" onclick="resetData()">Borrar todos los registros</button></div></div>`}
function saveConfig(){db.subject=csub.value;db.period=cper.value;db.pin=cpin.value||'1234';save();alert('Configuración guardada.');render();}
function resetData(){if(confirm('Esto borrará sesiones, asistencias, actividades y calificaciones. ¿Continuar?')){db={pin:db.pin,subject:db.subject,period:db.period,sessions:[],attendance:[],activities:[],submissions:[],grades:[]};save();render();}}
function show(inner){const m=document.getElementById('modal');m.classList.remove('hidden');m.innerHTML='<div>'+inner+'</div>'}
function hide(){document.getElementById('modal').classList.add('hidden')}
render();
document.addEventListener('change',e=>{if(e.target.id==='gact')drawGrades();if(e.target.id==='sessionSel')drawAtt();});
</script></body></html>
